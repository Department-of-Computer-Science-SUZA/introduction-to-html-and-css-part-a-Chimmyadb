<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three type of list</title>
</head>
<body>
   <h2>Ordered List</h2> 
   <ol>
    <li>Cofee</li>
    <li>Tea
        <ol type="a">
            <li>Back tea</li>
            <li>Green tea
                <ol type="i">
                    <li>China</li>
                    <li>Africa</li>
                </ol>
            </li>
        </ol>
    </li>
    <li>Milk</li>
   </ol>
   <h2>Unordered List</h2>
   <ul>
    <li>Iterm 1</li>
    <li>Iterm 2</li>
   </ul>
   <h2>Definition List</h2>
   <dl>
    <dt>Bangalore</dt>
    <dd>Capital City of Larnataka</dd>

    <dt>Mumbai</dt>
    <dd>Capital City of Maharashtra</dd>
   </dl>
</body>
</html>
