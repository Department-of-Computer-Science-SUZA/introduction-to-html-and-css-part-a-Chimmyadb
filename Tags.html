<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demostration of text formating</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>To illustrate text formating tags</h1>
    <hr>
    <marquee>This is an marguee text</marquee>
    <p><i>This is italized</i></p>
    <p><u>This is underlined</u></p>
    <p><b>This is bold</b></p>
    <p><em>This is emphasized</em></p>
    <p>This is <strong>Strong</strong></p>
    <p>This is<strike> Strike</strike></p>
    <p>This is <code>computer code</code></p>
    <p><sup>This is superscript</sup>Code</p>
    <p><sub>This is subscript</sub>Code</p>
    <p><big>This is Big Text</big></p>
    <p><small>This is small text</small></p>


</body>
</html>
