<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>form Validation</title>
  <link rel="stylesheet" href="formValidation.css" />
</head>
<body>
  <div class="form-box">
    <form id="userForm" onsubmit="return validateForm()">
      <h2>Test JavaScript Form Validation</h2>

      <label>Name <span class="required">*</span></label>
      <input type="text" id="name">
      <span class="error" id="nameError"></span>

      <label>Address <span class="required">*</span></label>
      <textarea id="address"></textarea>
      <span class="error" id="addressError"></span>

      <label>Zip Code <span class="required">*</span></label>
      <input type="text" id="zipcode">
      <span class="error" id="zipError"></span>

      <label>Country <span class="required">*</span></label>
      <select id="country">
        <option value="">Please Select a Country...</option>
        <option value="KN">Kenya</option>
        <option value="TZ">Tanzania</option>
        <option value="CA">Canada</option>
        <option value="IN">India</option>
      </select>
      <span class="error" id="countryError"></span>

      <label>Gender <span class="required">*</span></label>
      <div class="inline">
        <input type="radio" name="gender" value="Male"> Male
      </div>
      <div class="inline">
        <input type="radio" name="gender" value="Female"> Female
      </div>
      <span class="error" id="genderError"></span>

      <label>Preferences <span class="required">*</span></label>
      <div class="inline"><input type="checkbox" name="color" value="Red"> Red</div>
      <div class="inline"><input type="checkbox" name="color" value="Blue"> Blue</div>
      <div class="inline"><input type="checkbox" name="color" value="Green"> Green</div>
      <span class="error" id="prefsError"></span>

      <label>Phone <span class="required">*</span></label>
      <input type="tel" id="phone">
      <span class="error" id="phoneError"></span>

      <label>Email <span class="required">*</span></label>
      <input type="email" id="email">
      <span class="error" id="emailError"></span>

      <label>Password (6-8 characters) <span class="required">*</span></label>
      <input type="password" id="password">
      <span class="error" id="passwordError"></span>

      <label>Verify Password <span class="required">*</span></label>
      <input type="password" id="confirmPassword">
      <span class="error" id="confirmError"></span>

      <div class="buttons">
        <input type="submit" value="SEND">
        <input type="reset" value="CLEAR">
      </div>

      <div class="success" id="result"></div>
    </form>
  </div>
  <script src="formValidation.js"></script>
</body>
</html>
