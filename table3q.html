<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
</head>
<body style="padding: 10px; margin: 10px; ">
    <table border="1" cellpadding="10">
        <tr>
            <th colspan="4">Table Heading Cell Spanning 4 Columns</th>
        </tr>
        <tr>
            <td>Normal cell</td>
            <td colspan="2">Cell spanning 2 Columns</td>
            <td>Normal cell</td>
        </tr>
        <tr>
            <td rowspan="3" style="background-color: gray;">Cell spanning 3 row with a gray (US spelling backround)</td>
            <td>Normal cell</td>
            <td>Normal cell</td>
            <td>Normal cell</td>
        </tr>
        <tr>
            <td>Normal cell</td>
            <td colspan="2" rowspan="2">Cell spanning 2 rows and 2 columns</td>
        </tr>
        <tr>
            <td>Normal cell</td>
        </tr>
    </table>
</body>
</html>
